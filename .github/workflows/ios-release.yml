name: Sign Shift Blocks for App Store
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  archive:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install Flutter
        run: |
          git clone --depth 1 --branch 3.47.5 https://github.com/flutter/flutter.git "$RUNNER_TEMP/flutter"
          echo "$RUNNER_TEMP/flutter/bin" >> "$GITHUB_PATH"
      - run: flutter config --no-enable-swift-package-manager
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test test
      - run: flutter build ios --release --no-codesign --dart-define=ADMOB_BANNER_ID=ca-app-pub-2803803669720807/2134634273
      - name: Import existing certificate with new app profile
        env:
          P12: ${{ secrets.IOS_P12_BASE64 }}
          PASSWORD: ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE: ${{ secrets.IOS_PROFILE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$P12" | base64 --decode > "$RUNNER_TEMP/signing.p12"
          printf '%s' "$PROFILE" | base64 --decode > "$RUNNER_TEMP/app.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/profile.plist"
          UUID=$(/usr/libexec/PlistBuddy -c 'Print :UUID' "$RUNNER_TEMP/profile.plist")
          APP=$(/usr/libexec/PlistBuddy -c 'Print :Entitlements:application-identifier' "$RUNNER_TEMP/profile.plist")
          [[ "$APP" == '9Q26686S8R.com.wjbapps.shiftblocks' ]]
          KEYCHAIN="$RUNNER_TEMP/shift.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          echo "::add-mask::$KEYCHAIN_PASSWORD"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/signing.p12" -P "$PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN"
          security set-key-partition-list -S apple-tool:,apple: -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$RUNNER_TEMP/app.mobileprovision" "$HOME/Library/MobileDevice/Provisioning Profiles/$UUID.mobileprovision"
      - name: Archive and export
        run: |
          set -euo pipefail
          ruby -rxcodeproj <<'RUBY'
          project = Xcodeproj::Project.open('ios/Runner.xcodeproj')
          project.targets.find { |t| t.name == 'Runner' }.build_configurations.each do |c|
            next unless c.name == 'Release'
            c.build_settings['CODE_SIGN_STYLE'] = 'Manual'
            c.build_settings['CODE_SIGN_IDENTITY'] = 'Apple Distribution'
            c.build_settings['DEVELOPMENT_TEAM'] = '9Q26686S8R'
            c.build_settings['PROVISIONING_PROFILE_SPECIFIER'] = 'Shift Blocks AppStore 2026'
          end
          project.save
          RUBY
          xcodebuild -workspace ios/Runner.xcworkspace -scheme Runner -configuration Release -destination 'generic/platform=iOS' -archivePath build/ios/archive/ShiftBlocks.xcarchive archive
          xcodebuild -exportArchive -archivePath build/ios/archive/ShiftBlocks.xcarchive -exportPath build/ios/ipa -exportOptionsPlist ios/ExportOptions.plist
          codesign --verify --deep --strict build/ios/archive/ShiftBlocks.xcarchive/Products/Applications/Runner.app
          shasum -a 256 build/ios/ipa/*.ipa
      - name: Save signed archive for gated upload
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view signed-1.0.0-1 >/dev/null 2>&1 || gh release create signed-1.0.0-1 --draft --title 'Shift Blocks signed build 1' --notes 'Signing evidence. This workflow does not upload to Apple.'
          gh release upload signed-1.0.0-1 build/ios/ipa/*.ipa --clobber
      - name: Clean temporary keychain
        if: always()
        run: security delete-keychain "$RUNNER_TEMP/shift.keychain-db" || true

